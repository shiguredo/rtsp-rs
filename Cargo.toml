[package]
name = "shiguredo_rtsp"
version = "2026.1.0-canary.2"
edition = "2024"
rust-version = "1.93"
description = "Sans I/O RTSP/1.0 Library"
readme = "README.md"
homepage = "https://github.com/shiguredo/rtsp-rs"
repository = "https://github.com/shiguredo/rtsp-rs"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[workspace]
members = ["examples/rtsp_client", "pbt"]
exclude = ["fuzz"]

[dependencies]
# Digest 認証 (RFC 2617) のハッシュ計算に使う
md-5 = "0.11"
# RTSP は HTTP/1.1 の構文を踏襲するため、メッセージのパース・エンコードに使う
shiguredo_http11 = { version = "2026.6" }
