[package]
name = "rtsp_client"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
raw_player = { version = "2026.2.0-canary.0", optional = true }
shiguredo_http11 = "2026.6"
shiguredo_mp4 = "2026.3"
shiguredo_openh264 = { version = "2026.1", optional = true }
shiguredo_rtsp = { path = "../.." }

[features]
video-display = ["dep:raw_player", "dep:shiguredo_openh264"]
