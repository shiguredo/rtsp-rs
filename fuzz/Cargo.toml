[package]
name = "shiguredo_rtsp_fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[[bin]]
bench = false
doc = false
name = "fuzz_http_request"
path = "fuzz_targets/fuzz_http_request.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_http_response"
path = "fuzz_targets/fuzz_http_response.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_rtp"
path = "fuzz_targets/fuzz_rtp.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_rtcp"
path = "fuzz_targets/fuzz_rtcp.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_sdp"
path = "fuzz_targets/fuzz_sdp.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_interleaved"
path = "fuzz_targets/fuzz_interleaved.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_rtsp_client"
path = "fuzz_targets/fuzz_rtsp_client.rs"
test = false

[[bin]]
bench = false
doc = false
name = "fuzz_rtsp_limits"
path = "fuzz_targets/fuzz_rtsp_limits.rs"
test = false

[dependencies]
# cargo-fuzz (libFuzzer) のラッパー
libfuzzer-sys = "0.4"
# fuzz_rtsp_limits でデコーダーの上限設定に使う
shiguredo_http11 = "2026.6"

# テスト対象のクレート
[dependencies.shiguredo_rtsp]
path = ".."
